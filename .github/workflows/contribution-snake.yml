name: Generate Contribution Snake
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate snake
        uses: Platane/snk@v2
        id: snake
        with:
          github_user_name: FadhlanFSJ
          output_dir: .github/output
          svg_out_path: github-contribution-grid-snake.svg
      - name: Commit snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update contribution snake
          file_pattern: .github/output/github-contribution-grid-snake.svg