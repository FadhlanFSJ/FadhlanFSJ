name: Generate Contribution Snake
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate snake game from contribution grid
        uses: github-contribution-grid-snake-game@v1.0.0
        with:
          github_username: FadhlanFSJ
          output_file: .github/output/github-contribution-grid-snake.svg
      - name: Commit snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update contribution snake
          file_pattern: .github/output/github-contribution-grid-snake.svg